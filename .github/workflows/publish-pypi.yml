name: Build Python distributions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check videocaptioner/

      - name: Type check (CLI)
        run: uv run pyright videocaptioner/cli/

      - name: Unit tests (CLI)
        run: uv run pytest tests/test_cli/ -q

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # NOTE: no PyPI publish step. This fork cannot pass PyPI Trusted Publishing
  # (OIDC publisher is bound to the upstream WEIFENG2333/VideoCaptioner
  # repository). Wheels/sdist are available as workflow artifacts; to publish
  # upstream, open a PR there and let upstream's own workflow do it.
