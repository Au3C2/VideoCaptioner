name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check videocaptioner/ scripts/

      - name: Type check CLI
        run: uv run pyright videocaptioner/cli/

      - name: Build package
        run: uv build

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Full offline suite: external-service tests are deselected via
      # pyproject addopts (-m "not integration"); LLM tests run against
      # the mock_llm_client fixture in tests/conftest.py. No ffmpeg
      # binary needed: pydub usages are WAV-only, and the single binary
      # fixture (tests/test_thread/conftest.py) degrades to skip.
      - name: Unit tests (full offline suite)
        run: uv run pytest -q
