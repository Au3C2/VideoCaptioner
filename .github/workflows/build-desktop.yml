name: Build Desktop Installer

on:
  pull_request:
    paths:
      - "videocaptioner/**"
      - "resource/**"
      - "scripts/build_desktop.py"
      - "scripts/smoke_desktop.py"
      - "scripts/test_installer.py"
      - "scripts/test_dmg.py"
      - "VideoCaptioner.spec"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 installer + portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Builds the onedir bundle, the portable zip and the Inno Setup
      # installer (ISCC is preinstalled on windows-latest runners).
      - name: Build desktop bundle, portable zip and installer
        run: uv run --with pyinstaller --with static-ffmpeg python scripts/build_desktop.py --clean

      - name: Smoke test packaged CLI
        run: uv run python scripts/smoke_desktop.py dist/VideoCaptioner

      # Artifact acceptance test: silent install into a temp dir, bundle
      # verification, CLI smoke from the installed path, silent uninstall.
      # GUI liveness is probed locally (--skip-gui keeps CI deterministic).
      - name: Installer acceptance test
        shell: bash
        run: uv run python scripts/test_installer.py --installer artifacts/VideoCaptioner-*-windows-x64-setup.exe --skip-gui

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/*.zip artifacts/*.exe --clobber

  macos-dmg:
    name: macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # pydub-based audio tests need the ffmpeg binary (mp3 export/decode)
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Unit tests (full offline suite)
        run: uv run pytest -q

      - name: Build desktop bundle and DMG
        run: uv run --with pyinstaller --with static-ffmpeg --with ds-store --with mac-alias python scripts/build_desktop.py --clean

      - name: Smoke test packaged CLI
        run: uv run python scripts/smoke_desktop.py dist/VideoCaptioner

      # DMG lifecycle: mount, verify drag-install layout + ad-hoc signature,
      # install into /Applications (temp sandbox fallback), CLI smoke from the
      # installed path, uninstall, no-leftover check. GUI liveness is probed
      # locally (--skip-gui keeps CI deterministic).
      - name: DMG acceptance test
        run: uv run python scripts/test_dmg.py --skip-gui

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/*.dmg --clobber
